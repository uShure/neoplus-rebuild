# Нео+ Балашиха — редиректы склеенных дублей
# Вставить в server {} перед root/index
rewrite ^narkologicheskij-dispanser/$ /narkologicheskiy-dispanser/ permanent;
rewrite ^reabilitatsiya-narkozavisimykh/$ /reabilitatsiya-narkozavisimyh/ permanent;

# trailing slash для каталогов (как на старом сайте)
location ~ ^(.+)/$ { try_files $1/index.html $1/ =404; }
error_page 404 /404.html;
